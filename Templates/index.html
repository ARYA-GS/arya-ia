<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARYA IA - Análise de Risco</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Plataforma de Análise de Risco de Desastres</h1>
        <p>Selecione um dos modelos de Machine Learning para processar os dados e visualizar os resultados no mapa.</p>
    </header>

    <main>
        <div class="controls">
            <h2>Selecione o Modelo</h2>
            <button id="runClassifierBtn" class="btn">Classificador de Desastres</button>
            <button id="runPredictorBtn" class="btn">Preditor de Risco de Ocorrência</button>
        </div>
        
        <div id="loader" class="loader" style="display: none;"></div>
        <div id="info" class="info-box"></div>
        
        <div id="plotlyChart"></div>
    </main>
    
    <footer>
        <p>&copy; 2024 - Desenvolvido com Flask & Plotly.js</p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
